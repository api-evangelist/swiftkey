name: Swiftkey
description: 'SwiftKey is a predictive on-screen keyboard for Android and iOS that uses machine learning
  to improve autocorrect, next-word prediction, and swipe-to-type (SwiftKey Flow). Founded in London as
  TouchType, it was acquired by Microsoft in 2016 and is now shipped as Microsoft SwiftKey. The former
  SwiftKey SDK for embedding its prediction engine has been discontinued, and www.swiftkey.com now
  permanently redirects to microsoft.com/swiftkey. As of this enrichment pass the product exposes no
  public developer API, SDK registry package, or developer portal.'
